# split panes using prefix \ and prefix -
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"' 
unbind '%'

# open new windows in current directory
bind c new-window -c "#{pane_current_path}"

# remap prefix from C-b to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# switch panes with meta key
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-[ select-pane -t -1
bind -n M-] select-pane -t +1
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# switch windows with meta key
bind -n M-, select-window -t -1
bind -n M-. select-window -t +1

# reload config file
bind r source-file ~/.tmux.conf

# enable vim bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy -p'

# don't rename windows automatically
set-option -g allow-rename off

# change inactive window color: 
set -g window-status-style bg=#98971a,fg=black

# change active window color
set -g window-status-current-style bg=red,fg=white

# change border color of all panes
set -g pane-border-style "fg=grey"

# change active pane border color hightlight
set -g pane-active-border-style "fg=grey, bg=green"

# set the base index for windows to 1 instead of 0
set -g base-index 1

# set the base index for panes to 1 instead of 0
set -g pane-base-index 1

# get rid of delay
set -s escape-time 0

# extended keys and format for pi
set -g extended-keys on
set -g extended-keys-format csi-u

# date format
set-option -g status-right '%a %Y-%m-%d %H:%M %Z  '

# Agent wrappers enable mouse events while running; ordinary shells keep them off.
set -g mouse off

# ordinary left-drag selects through tmux, even in mouse-aware fullscreen apps
bind-key -T root MouseDrag1Pane select-pane -t = \; copy-mode -M -t =

# copy selections into Sway's PRIMARY only, never the regular clipboard
set-option -s set-clipboard off
set-option -s copy-command 'wl-copy --primary'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# paste Wayland PRIMARY into the clicked pane, using bracketed paste
bind-key -T root MouseDown2Pane select-pane -t = \; run-shell 'wl-paste --primary --no-newline | tmux load-buffer -b primary - && tmux paste-buffer -p -b primary -t "#{mouse_pane}"'

# workmux: dashboard popup, sidebar toggle, agent switching
bind a display-popup -h 80% -w 80% -E "workmux dashboard --tab agents"
bind C-s display-popup -h 80% -w 80% -E "workmux dashboard --tab worktrees"
bind t run-shell "workmux sidebar --session"
bind T run-shell "workmux sidebar"
bind L run-shell "workmux last-done"
bind Tab run-shell "workmux last-agent"
